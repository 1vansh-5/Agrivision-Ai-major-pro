services:
  - type: web
    name: agrivision-api
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_VISION_MODEL
        value: meta-llama/llama-4-scout-17b-16e-instruct
      - key: GROQ_TEXT_MODEL
        value: llama-3.3-70b-versatile
      - key: ALLOWED_ORIGIN
        sync: false
